title: Multiple Failed Login Attempts From Single Source
id: 4e69d723-690c-4573-8998-349c258d400e

status: experimental

description: Detect Failed Login Attempts

references:
  - https://attack.mitre.org/techniques/T1110

author: Jerry
date: 2026/05/18

logsource:
  product: linux

detection:
  selection:
    message|contains: "authentication failure"

  condition: selection

timeframe: 5m

fields:
  - message
  - host.name

falsepositives:
  - Automated service account with expired passwords
  - Misconfigured internal script

level: medium

tags:
  - attack.initial_access
  - attack.t1110.001