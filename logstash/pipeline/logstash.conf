input {
    beats {
        port => 5044
    }
}

filter {
    grok {
        match => {
            "message" => [
                "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} %{DATA:process}(?:\[%{NUMBER:pid}\])?: %{GREEDYDATA:log_message}"
            ]
        }
    }

    # Failed SSH login
    if "Failed password" in [message] {
        grok {
            match => {
                "message" => "Failed password for (invalid user )?%{USERNAME:user} from %{IP:source_ip}"
            }
        }

        mutate {
            add_field => {
                "[event][action]" => "failed_login"
            }
        }
    }

    # Successful SSH login
    if "Accepted password" in [message] {
        grok {
            match => {
                "message" => "Accepted password for %{USERNAME:user} from %{IP:source_ip}"
            }
        }

        mutate {
            add_field => {
                "[event][action]" => "successful_login"
            }
        }
    }

    # Session opened
    if "session opened" in [message] {
        mutate {
            add_field => {
                "[event][action]" => "session_open"
            }
        }
    }

    # Session closed
    if "session closed" in [message] {
        mutate {
            add_field => {
                "[event][action]" => "session_closed"
            }
        }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "logs-%{+YYYY.MM.dd}"
    }

    stdout {
        codec => rubydebug
    }
}